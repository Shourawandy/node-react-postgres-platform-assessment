name: CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - master
      - 'pre-release/v*'
      - 'release/v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci
          npm test --if-present

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Namespace & Tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REF_NAME=${GITHUB_REF_NAME//\//-}
          IMAGE_TAG="${REF_NAME}-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "namespace=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" =~ refs/heads/pre-release/.* ]]; then
            echo "namespace=preprod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" =~ refs/heads/release/.* ]]; then
            echo "namespace=release" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.REGISTRY_USER }}/backend:${{ steps.vars.outputs.tag }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ secrets.REGISTRY_USER }}/frontend:${{ steps.vars.outputs.tag }}

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          TARGET_NS="${{ steps.vars.outputs.namespace }}"
          kubectl create namespace ${TARGET_NS} --dry-run=client -o yaml | kubectl apply -f -
          kubectl set image deployment/backend backend=${{ secrets.REGISTRY_USER }}/backend:${{ steps.vars.outputs.tag }} -n ${TARGET_NS}
          kubectl set image deployment/frontend frontend=${{ secrets.REGISTRY_USER }}/frontend:${{ steps.vars.outputs.tag }} -n ${TARGET_NS}
          kubectl rollout status deployment/backend -n ${TARGET_NS}
          kubectl rollout status deployment/frontend -n ${TARGET_NS}
