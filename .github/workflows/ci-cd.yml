name: CI/CD Multi-Environment Pipeline

on:
  push:
    branches:
      - master
      - 'pre-release/v*'
      - 'release/v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci
          npm test --if-present

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Target Namespace & Tag
        id: set-env
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"
          
          SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "SAFE_BRANCH=$SAFE_BRANCH_NAME" >> $GITHUB_OUTPUT
          
          if [ "$BRANCH_NAME" = "master" ]; then
            echo "NAMESPACE=dev" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" =~ ^pre-release/v ]]; then
            echo "NAMESPACE=preprod" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" =~ ^release/v ]]; then
            echo "NAMESPACE=release" >> $GITHUB_OUTPUT
          else
            echo "NAMESPACE=dev" >> $GITHUB_OUTPUT
          fi
          
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_USER }}/node-backend:${{ steps.set-env.outputs.SAFE_BRANCH }}-${{ steps.set-env.outputs.sha_short }}
            ${{ secrets.REGISTRY_USER }}/node-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.REGISTRY_USER }}/react-frontend:${{ steps.set-env.outputs.SAFE_BRANCH }}-${{ steps.set-env.outputs.sha_short }}
            ${{ secrets.REGISTRY_USER }}/react-frontend:latest

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          TARGET_NS="${{ steps.set-env.outputs.NAMESPACE }}"
          echo "Deploying to namespace: $TARGET_NS"
          
          kubectl create namespace $TARGET_NS --dry-run=client -o yaml | kubectl apply --validate=false -f -
          
          kubectl set image deployment/backend-deployment backend=${{ secrets.REGISTRY_USER }}/node-backend:${{ steps.set-env.outputs.SAFE_BRANCH }}-${{ steps.set-env.outputs.sha_short }} -n $TARGET_NS --validate=false || true
          kubectl set image deployment/frontend-deployment frontend=${{ secrets.REGISTRY_USER }}/react-frontend:${{ steps.set-env.outputs.SAFE_BRANCH }}-${{ steps.set-env.outputs.sha_short }} -n $TARGET_NS --validate=false || true
