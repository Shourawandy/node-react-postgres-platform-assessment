apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: preprod
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "postgres"
  DB_WRITE_URL: "postgres://postgres:password@postgres-service:5432/postgres"
  DB_READ_URL: "postgres://postgres:password@postgres-service:5432/postgres"
